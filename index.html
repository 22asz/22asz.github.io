<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tools Portal</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding-top: 50px; }
        .menu { display: flex; flex-direction: column; gap: 15px; max-width: 300px; margin: 0 auto; }
        .warning-separator {
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ff4444, transparent);
            margin: 8px 0;
        }
        a { padding: 15px; background: #222; color: #00ffcc; text-decoration: none; border-radius: 8px; border: 1px solid #333; font-weight: bold; }
        a.thiscord { color: #7289da; }
        a.warning { background: #3a1d1d; color: #ff8a80; border-color: #ff4444; }
        a:hover { background: #333; }
        a.thiscord:hover { background: #333; color: #7289da; }
        a.warning:hover { background: #4a2424; }
    </style>
</head>
<body>
    <h1>Tools</h1>
    <p>Select a tool to launch:</p>
    <div class="menu">
        <a class="thiscord" href="https://22asz.github.io/thiscord">Thiscord</a>
        <div class="warning-separator" aria-hidden="true"></div>
        <a class="warning" href="https://22asz.github.io/glaze/">Alec Glaze (do not click)</a>
        <a class="warning" href="https://22asz.github.io/touchcraft">Eaglercraft: Touch (experimental)</a>
    </div>
</body>
</html>
